# How the factory ships this project (software-factory docs/project.md, the project.yaml contract).
apiVersion: factory/v2
name: argo
deploy:
  mode: make # `make deploy` builds origin/master on the mini; `make verify` proves the process
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 30m
ship:
  - { via: push }
# leads: 1 is from the first project.yaml (897432e7, 2026-11-02); no reason was recorded. Unset is 64 (NL32).
leads: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
# The unit suites (Makefile `test`) may run on the factory's Linux step host when the mini's test line would make a lead
# wait longer (`$(call slot,unit)`). Checked by reading the suites: no database (test:api, the DB run, stays home), no
# browser, no shell tool beyond bun, and the generated clients they import are committed (apps/api/src/generated).
steps:
  unit:
    make: test
    remote: true

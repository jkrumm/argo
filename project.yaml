# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: argo
deploy:
  mode: make # `make deploy` builds origin/master on the mini; `make verify` proves the process
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 30m
  migrations: [apps/api/drizzle/]
ship:
  - { paths: ["**"], via: push }
leads: 1

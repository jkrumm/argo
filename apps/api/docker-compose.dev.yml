services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: argo
      POSTGRES_USER: argo
      POSTGRES_PASSWORD: ${ARGO_DB_PASSWORD}
    ports:
      - '5433:5432'
    volumes:
      - argo_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U argo -d argo']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  argo_pg_dev:

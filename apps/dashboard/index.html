<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Argo" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="darkreader-lock" />
    <title>Argo</title>
    <script>
      // ColorSchemeScript: prevents flash of wrong color scheme on load
      try {
        var stored = localStorage.getItem('mantine-color-scheme-value')
        document.documentElement.setAttribute('data-mantine-color-scheme', stored || 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

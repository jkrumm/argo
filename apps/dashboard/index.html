<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Argo</title>
    <script>
      // The stored color scheme, before first paint, so Mantine's tokens resolve to it.
      // Setting the attribute also DISARMS basaltAppPlugin's anti-FOUC <style>, which is
      // scoped `html:not([data-mantine-color-scheme])` since basalt-ui 1.21.0 — after this
      // line Mantine's own layered `color-scheme` rule owns the native controls. The inline
      // `style.colorScheme` this used to write is gone with the unlayered rule that forced it.
      try {
        document.documentElement.setAttribute(
          'data-mantine-color-scheme',
          localStorage.getItem('mantine-color-scheme-value') || 'dark',
        )
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

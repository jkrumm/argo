<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Argo</title>
    <script>
      // Color scheme, before first paint. Two jobs:
      //   1. data-mantine-color-scheme, so Mantine's tokens resolve to the stored scheme.
      //   2. an INLINE color-scheme, because basaltAppPlugin's anti-FOUC <style> pins
      //      `html{color-scheme:dark}` UNLAYERED — which outranks Mantine's own
      //      `@layer mantine{:root{color-scheme:var(--mantine-color-scheme)}}` in every
      //      scheme, so light mode would otherwise get dark scrollbars and native
      //      controls. Only an inline style attribute outranks an unlayered rule.
      //      Remove once the plugin stops hardcoding the dark scheme.
      try {
        var stored = localStorage.getItem('mantine-color-scheme-value') || 'dark'
        var root = document.documentElement
        root.setAttribute('data-mantine-color-scheme', stored)
        root.style.colorScheme = stored === 'auto' ? 'light dark' : stored
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

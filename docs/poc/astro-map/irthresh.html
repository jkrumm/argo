<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>IR threshold sweep</title>
<link href="/node_modules/.bun/maplibre-gl@6.3.0/node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  body { margin:0; background:#18181b; color:#e4e4e7; font:12px system-ui; }
  .row { display:flex; height:50vh; }
  .pane { flex:1; position:relative; border:1px solid #3f3f46; }
  .label { position:absolute; z-index:2; top:4px; left:4px; background:#000c; padding:2px 6px; }
  .map { width:100%; height:100%; }
</style>
</head>
<body>
<div class="row">
  <div class="pane"><div class="label">truth — clm mask (what cloud actually is)</div><div id="t" class="map"></div></div>
  <div class="pane"><div class="label">ir108 — shipped 200/380/560/765</div><div id="a" class="map"></div></div>
</div>
<div class="row">
  <div class="pane"><div class="label">ir108 — 240/280/324</div><div id="b" class="map"></div></div>
  <div class="pane"><div class="label">ir108 — 265/300/340</div><div id="c" class="map"></div></div>
</div>
<script type="module">
import { Map as MLMap } from "/node_modules/.bun/maplibre-gl@6.3.0/node_modules/maplibre-gl/dist/maplibre-gl.mjs";
const G = '212,212,216'
const OSM = ['https://tile.openstreetmap.org/{z}/{x}/{y}.png']
const style = () => ({ version:8,
  sources:{ base:{ type:'raster', tiles:OSM, tileSize:256 } },
  layers:[ { id:'bg', type:'background', paint:{ 'background-color':'#18181b' } },
           { id:'base', type:'raster', source:'base', paint:{ 'raster-opacity':0.8, 'raster-saturation':-0.9 } } ] })
const EUM = 'https://view.eumetsat.int/geoserver/wms'
const wms = (layer) => `${EUM}?${new URLSearchParams({ service:'WMS',version:'1.1.1',request:'GetMap',
  layers:layer,styles:'',format:'image/png',transparent:'true',width:'256',height:'256',srs:'EPSG:3857'})}&bbox={bbox-epsg-3857}`
const C = [11.4,47.0], Z = 4
function decoded(el, layer, stops, resampling) {
  const m = new MLMap({ container:el, style: style(), center:C, zoom:Z, attributionControl:false })
  m.on('load', () => {
    m.addSource('s', { type:'raster-dem', tiles:[wms(layer)], tileSize:256,
      encoding:'custom', redFactor:1, greenFactor:1, blueFactor:1, baseShift:0 })
    m.addLayer({ id:'l', type:'color-relief', source:'s',
      paint:{ 'color-relief-color': ['interpolate',['linear'],['elevation'], ...stops], 'color-relief-opacity':1, resampling } })
  })
}
decoded('t','msg_fes:clm',[0,`rgba(${G},0)`,400,`rgba(${G},0)`,520,`rgba(${G},0.55)`,765,`rgba(${G},0.85)`],'nearest')
decoded('a','msg_fes:ir108',[0,`rgba(${G},0)`,200,`rgba(${G},0)`,380,`rgba(${G},0.35)`,560,`rgba(${G},0.6)`,765,`rgba(${G},0.8)`],'linear')
decoded('b','msg_fes:ir108',[0,`rgba(${G},0)`,240,`rgba(${G},0)`,280,`rgba(${G},0.45)`,324,`rgba(${G},0.8)`],'linear')
decoded('c','msg_fes:ir108',[0,`rgba(${G},0)`,265,`rgba(${G},0)`,300,`rgba(${G},0.5)`,340,`rgba(${G},0.85)`],'linear')
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Shipped-value verification</title>
<link href="/node_modules/.bun/maplibre-gl@6.3.0/node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --vx-lp-lpCity:#e76a6e; --vx-lp-lpUrban:#eb6847; --vx-lp-lpSuburban:#ec9a3c;
    --vx-lp-lpRural:#f0b726; --vx-lp-lpDark:#38bdf8; --vx-lp-lpDarker:#38bdf8;
    --vx-lp-lpPristine:#38bdf8; --vx-cloudHigh:#d4d4d8;
  }
  body { margin:0; background:#18181b; color:#e4e4e7; font:12px system-ui; }
  .row { display:flex; height:50vh; }
  .pane { flex:1; position:relative; border:1px solid #3f3f46; }
  .label { position:absolute; z-index:2; top:4px; left:4px; background:#000c; padding:2px 6px; }
  .map { width:100%; height:100%; }
</style>
</head>
<body>
<div class="row">
  <div class="pane"><div class="label">A — shipped LP ramp over OSM</div><div id="a" class="map"></div></div>
  <div class="pane"><div class="label">B — shipped LP over OpenTopoMap + base wash</div><div id="b" class="map"></div></div>
</div>
<div class="row">
  <div class="pane"><div class="label">C — shipped CLOUD_RAMP (mask, factors 1/1/1)</div><div id="c" class="map"></div></div>
  <div class="pane"><div class="label">D — shipped cloud-ir: GIBS raw RGBA @ opacity .6 (Americas)</div><div id="d" class="map"></div></div>
</div>
<script type="module">
import { Map as MLMap } from "/node_modules/.bun/maplibre-gl@6.3.0/node_modules/maplibre-gl/dist/maplibre-gl.mjs";

// Dumped straight out of the shipped map-layers.ts, not retyped.
const R = {"LP":[{"stop":1800,"token":"var(--vx-lp-lpCity)","alpha":0.72},{"stop":1960,"token":"var(--vx-lp-lpUrban)","alpha":0.66},{"stop":2060,"token":"var(--vx-lp-lpSuburban)","alpha":0.62},{"stop":2095,"token":"var(--vx-lp-lpSuburban)","alpha":0.58},{"stop":2130,"token":"var(--vx-lp-lpRural)","alpha":0.56},{"stop":2145,"token":"var(--vx-lp-lpRural)","alpha":0.56},{"stop":2155,"token":"var(--vx-lp-lpDark)","alpha":0.58},{"stop":2170,"token":"var(--vx-lp-lpDark)","alpha":0.62},{"stop":2180,"token":"var(--vx-lp-lpDarker)","alpha":0.66},{"stop":2190,"token":"var(--vx-lp-lpDarker)","alpha":0.7},{"stop":2200,"token":"var(--vx-lp-lpPristine)","alpha":0.74}],
"CLOUD":[{"stop":0,"token":"var(--vx-cloudHigh)","alpha":0},{"stop":400,"token":"var(--vx-cloudHigh)","alpha":0},{"stop":520,"token":"var(--vx-cloudHigh)","alpha":0.55},{"stop":765,"token":"var(--vx-cloudHigh)","alpha":0.85}],
}

// Same resolution the app's resolveStopColor does: read the var, turn #rrggbb into rgba().
const cs = getComputedStyle(document.documentElement)
function resolve(token, alpha) {
  const name = token.slice(4, -1)
  const hex = cs.getPropertyValue(name).trim()
  const n = parseInt(hex.slice(1), 16)
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`
}
const ramp = (rows) => ['interpolate',['linear'],['elevation'], ...rows.flatMap(r => [r.stop, resolve(r.token, r.alpha)])]

const OTM = ['https://a.tile.opentopomap.org/{z}/{x}/{y}.png','https://b.tile.opentopomap.org/{z}/{x}/{y}.png']
const OSM = ['https://tile.openstreetmap.org/{z}/{x}/{y}.png']
// The shipped base-wash values from map-overlays.ts syncBaseWash.
const WASH = { 'raster-opacity':0.55, 'raster-saturation':-0.55, 'raster-brightness-max':0.75 }
const PLAIN = { 'raster-opacity':0.8, 'raster-saturation':-0.9 }
const style = (tiles, paint) => ({ version:8,
  sources:{ base:{ type:'raster', tiles, tileSize:256 } },
  layers:[ { id:'bg', type:'background', paint:{ 'background-color':'#18181b' } },
           { id:'base', type:'raster', source:'base', paint } ] })

function lp(el, tiles, paint) {
  const m = new MLMap({ container:el, style: style(tiles, paint), center:[11.4,47.9], zoom:7, attributionControl:false })
  m.on('load', () => {
    m.addSource('lp', { type:'raster-dem', tiles:['./.cache/lp/{z}/{x}/{y}.png'], tileSize:256, minzoom:6, maxzoom:7, encoding:'terrarium' })
    m.addLayer({ id:'lp', type:'color-relief', source:'lp',
      paint:{ 'color-relief-color': ramp(R.LP), 'color-relief-opacity':1, resampling:'linear' } })
  })
}
lp('a', OSM, PLAIN)
lp('b', OTM, WASH)

const EUM = 'https://view.eumetsat.int/geoserver/wms'
const wms = (layer) => `${EUM}?${new URLSearchParams({ service:'WMS',version:'1.1.1',request:'GetMap',
  layers:layer,styles:'',format:'image/png',transparent:'true',width:'256',height:'256',srs:'EPSG:3857'})}&bbox={bbox-epsg-3857}`

function decoded(el, layer, rows, resampling) {
  const m = new MLMap({ container:el, style: style(OSM, PLAIN), center:[11.4,47.0], zoom:4, attributionControl:false })
  m.on('load', () => {
    m.addSource('s', { type:'raster-dem', tiles:[wms(layer)], tileSize:256,
      encoding:'custom', redFactor:1, greenFactor:1, blueFactor:1, baseShift:0 })
    m.addLayer({ id:'l', type:'color-relief', source:'s',
      paint:{ 'color-relief-color': ramp(rows), 'color-relief-opacity':1, resampling } })
  })
}
decoded('c', 'msg_fes:clm', R.CLOUD, 'nearest')

// `cloud-ir` ships as a PLAIN RGBA raster, deliberately NOT decoded — GIBS' Clean Infrared
// carries a cold-top colour enhancement that `color-relief` discards (ASTRO-MAP-RESEARCH §9.8).
// Centred on the Americas because Europe is outside GOES-East's disc.
const gibsTime = new Date(Math.floor((Date.now() - 40*60000) / 600000) * 600000)
  .toISOString().replace(/\.\d{3}Z$/, 'Z')
const d = new MLMap({ container:'d', style: style(OSM, PLAIN), center:[-60,-5], zoom:3, attributionControl:false })
d.on('load', () => {
  d.addSource('gibs', { type:'raster', maxzoom:6, tileSize:256, tiles:[
    `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/GOES-East_ABI_Band13_Clean_Infrared/default/${gibsTime}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png` ] })
  d.addLayer({ id:'gibs', type:'raster', source:'gibs', paint:{ 'raster-opacity':0.6 } })
})
</script>
</body>
</html>

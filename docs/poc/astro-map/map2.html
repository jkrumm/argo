<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>astro map POC 2</title>
    <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
    <style>
      html,
      body,
      #map {
        margin: 0;
        height: 100%;
        background: #111;
      }
      #p {
        position: absolute;
        z-index: 9;
        top: 6px;
        left: 6px;
        background: #000c;
        color: #8ec5ff;
        font: 11px monospace;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <div id="p"></div>
    <div id="map"></div>
    <script>
      const BASES = {
        ofm_dark: { type: 'style', url: 'https://tiles.openfreemap.org/styles/dark' },
        ofm_fiord: { type: 'style', url: 'https://tiles.openfreemap.org/styles/fiord' },
        ofm_positron: { type: 'style', url: 'https://tiles.openfreemap.org/styles/positron' },
        esri_sat: {
          type: 'raster',
          tiles: [
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          ],
          attribution: 'Esri, Maxar, Earthstar Geographics',
        },
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          attribution: '© OpenStreetMap contributors',
        },
      }
      const rasterStyle = (b) => ({
        version: 8,
        sources: {
          b: { type: 'raster', tiles: b.tiles, tileSize: 256, attribution: b.attribution },
        },
        layers: [{ id: 'b', type: 'raster', source: 'b' }],
      })
      window.__errors = []
      let map
      function build(baseKey, opts) {
        const b = BASES[baseKey]
        if (map) map.remove()
        map = new maplibregl.Map({
          container: 'map',
          style: b.type === 'style' ? b.url : rasterStyle(b),
          center: opts.center || [11.4, 47.8],
          zoom: opts.zoom || 7,
          attributionControl: false,
        })
        map.addControl(new maplibregl.AttributionControl({ compact: true }))
        map.on('error', (e) => window.__errors.push(String(e?.error?.message || e)))
        window.__ready = false
        map.on('load', () => {
          const layers = map.getStyle().layers
          // first symbol layer = where labels start; put rasters BELOW it so place names stay readable
          const firstSymbol = layers.find((l) => l.type === 'symbol')?.id
          map.addSource('lp', {
            type: 'raster',
            tiles: [
              'https://djlorenz.github.io/astronomy/image_tiles/tiles' +
                (opts.year || 2025) +
                '/tile_{z}_{x}_{y}.png',
            ],
            tileSize: 1024,
            minzoom: 0,
            maxzoom: 6,
            attribution: 'Light Pollution Atlas ' + (opts.year || 2025) + ', David J. Lorenz',
          })
          map.addLayer(
            {
              id: 'lp',
              type: 'raster',
              source: 'lp',
              paint: {
                'raster-opacity': opts.lpOpacity ?? 0.35,
                'raster-resampling': opts.resampling || 'linear',
              },
            },
            firstSymbol,
          )
          if (opts.radar) {
            map.addSource('radar', {
              type: 'raster',
              tiles: [
                'https://maps.dwd.de/geoserver/dwd/wms?service=WMS&version=1.3.0&request=GetMap&layers=dwd%3ARadar_rv_product_1x1km_ger&styles=&crs=EPSG%3A3857&bbox={bbox-epsg-3857}&width=512&height=512&format=image%2Fpng&transparent=true',
              ],
              tileSize: 512,
              attribution: 'DWD',
            })
            map.addLayer(
              { id: 'radar', type: 'raster', source: 'radar', paint: { 'raster-opacity': 0.8 } },
              firstSymbol,
            )
          }
          map.once('idle', () => {
            window.__ready = true
          })
        })
      }
      window.build = build
      build('ofm_dark', { lpOpacity: 0.35 })
    </script>
  </body>
</html>

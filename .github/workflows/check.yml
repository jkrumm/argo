name: check
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The local bin, never `bunx` — `bunx` resolves a CACHED copy from npm and does not
      # re-resolve it, so it can answer for a different version than the one being built
      # against (observed: a 1.20.0 cache answering for a 1.22.0 install).
      - name: basalt drift gate (managed files match the installed basalt-ui)
        run: ./node_modules/.bin/basalt-ui sync --check
      # lint, theme guard, format, typechecks and unit tests: the same gates as local `make check`.
      - run: make check
      - name: fallow analysis (report-only)
        continue-on-error: true
        run: bunx fallow --json | tee fallow-report.json

name: check
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # basalt drift (local bin, never `bunx`: it can answer for a cached, different version),
      # lint, theme guard, format, typechecks, dashboard build and unit tests: the same gates as local `make check`.
      - run: make check
      - name: fallow analysis (report-only)
        continue-on-error: true
        run: bunx fallow --json | tee fallow-report.json

name: Deploy

# Continuous deployment of argo (api + dashboard) to the VPS via RollHook.
#
# Auth: GitHub OIDC → RollHook exchanges for short-lived registry creds.
# No secrets in CI. RollHook authorizes by reading the rollhook.allowed_repos
# label off the running container (see vps/apps/argo/compose.yml).
#
# Both jobs run in parallel — api and dashboard are independent.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: Deploy argo-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jkrumm/rollhook-action@v1
        with:
          url: https://rollhook.jkrumm.com
          image_name: argo-api
          dockerfile: apps/api/Dockerfile
          context: .
          # Baked in so /health can report WHICH commit is serving. A probe
          # that only proves the container is up cannot tell a landed deploy
          # from a container that restarted for an unrelated reason.
          build_args: |
            GIT_SHA=${{ github.sha }}

  dashboard:
    name: Deploy argo-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jkrumm/rollhook-action@v1
        with:
          url: https://rollhook.jkrumm.com
          image_name: argo-dashboard
          dockerfile: apps/dashboard/Dockerfile
          context: .
          # HyperDX ingestion key is public-by-design (Sentry-DSN equivalent) —
          # safe to bake into the static bundle. Synced to every repo by
          # dotfiles/scripts/github-config.sh (op://vps/argo/HYPERDX_API_KEY_PROD).
          build_args: |
            VITE_HYPERDX_API_KEY=${{ secrets.HYPERDX_API_KEY_PROD }}
